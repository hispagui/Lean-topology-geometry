name = "Lean-topology-geometry"
defaultTargets = ["LeanTraining", "AlgebraicGeometry"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "LeanTraining" 
roots = ["lean_training"]

[[lean_lib]]
name = "AlgebraicGeometry"
globs = ["AlgebGeom.+"]